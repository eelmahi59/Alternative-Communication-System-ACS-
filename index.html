<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mind2Voice</title>
    <style>
        :root {
            --bg: #e9edf3;
            --device-frame: #111827;
            --device-edge: #2f3746;
            --screen: #f5f7fa;
            --screen-accent: #dfe8f3;
            --text: #1f2937;
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --shadow: rgba(15, 23, 42, 0.25);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--bg);
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
        }

        .ipad-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .ipad {
            position: relative;
            width: min(82vw, 860px);
            aspect-ratio: 1.43;
            background: linear-gradient(145deg, #1f2937 0%, #0f172a 40%, #111827 100%);
            border-radius: 34px;
            padding: 18px 18px 22px;
            box-shadow:
                0 30px 60px var(--shadow),
                inset 0 0 0 2px rgba(255,255,255,0.08),
                inset 0 0 0 8px rgba(255,255,255,0.02);
        }

        .screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #f8fafc 0%, var(--screen-accent) 100%);
            border-radius: 26px;
            overflow: hidden;
            position: relative;
            border: 2px solid rgba(15, 23, 42, 0.08);
        }

        .camera {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background: #0f172a;
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            z-index: 3;
        }

        .content {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 30px 40px;
            background: radial-gradient(circle at top, rgba(59,130,246,0.10), transparent 45%);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2.2rem, 4vw, 4rem);
            letter-spacing: 0.04em;
        }

        h2 {
            margin: 0 0 30px;
            font-size: clamp(1rem, 1.7vw, 1.6rem);
            color: #374151;
            font-weight: 500;
            max-width: 620px;
            line-height: 1.4;
        }

        .button-row {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 180px;
            padding: 18px 24px;
            border-radius: 16px;
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(37, 99, 235, 0.35);
        }

        .home-indicator {
            position: absolute;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
            width: 130px;
            height: 6px;
            background: rgba(255,255,255,0.4);
            border-radius: 999px;
        }
    </style>
</head>
<body>
    <div class="ipad-wrap">
        <div class="ipad">
            <div class="camera"></div>
            <div class="screen">
                <div class="content">
                    <h1>Mind2Voice</h1>
                    <h2>AI Assisted Communication for Nonverbal Autism</h2>

                    <div class="button-row">
                        <a href="letterboard.html" class="button">Letter Board</a>
                        <a href="phraseboard.html" class="button">Phrase Board</a>
                    </div>
                </div>
            </div>
            <div class="home-indicator"></div>
        </div>
    </div>
</body>
</html>
