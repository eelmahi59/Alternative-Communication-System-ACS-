<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mind2Voice">

<title>Mind2Voice</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="device-selector">

    <button
        class="device-btn active"
        data-device="ipad">
        Phone / iPad
    </button>

    <button
        class="device-btn"
        data-device="web">
        Web
    </button>

    <button
        class="device-btn"
        id="themeToggle">
        🌙 Dark
    </button>

    <button
        class="device-btn"
        id="fullscreenBtn">
        ⛶ Fullscreen
    </button>

</div>

<div class="ipad" id="deviceFrame">

    <div class="camera"></div>

    <div class="screen">

        <div class="content">

            <h1>Mind2Voice</h1>

            <h2>
                AI Assisted Communication for
                Nonverbal Autism
            </h2>

            <div class="button-row">

                <a
                    href="letterboard.html"
                    class="button">
                    Letter Board
                </a>

                <a
                    href="phraseboard.html"
                    class="button">
                    Phrase Board
                </a>

            </div>

        </div>

    </div>

    <div class="home-indicator"></div>

</div>

<script>

/* ------------------------------
DEVICE SWITCH
------------------------------ */

const deviceFrame =
document.getElementById(
"deviceFrame"
);

document
.querySelectorAll(
"[data-device]"
)
.forEach(btn => {

    btn.addEventListener(
    "click",
    () => {

        document
        .querySelectorAll(
        "[data-device]"
        )
        .forEach(b =>
            b.classList.remove(
            "active"
            )
        );

        btn.classList.add(
        "active"
        );

        deviceFrame.classList.remove(
        "web-view"
        );

        if(
            btn.dataset.device
            === "web"
        ){
            deviceFrame.classList.add(
            "web-view"
            );
        }

    });

});

/* ------------------------------
THEME
------------------------------ */

const themeToggle =
document.getElementById(
"themeToggle"
);

function updateThemeButton(){

    themeToggle.textContent =
    document.body.classList.contains(
    "dark"
    )
    ? "☀️ Light"
    : "🌙 Dark";

}

const savedTheme =
localStorage.getItem(
"theme"
);

if(savedTheme === "dark"){

    document.body.classList.add(
    "dark"
    );

}

updateThemeButton();

themeToggle.addEventListener(
"click",
() => {

    document.body.classList.toggle(
    "dark"
    );

    localStorage.setItem(
    "theme",
    document.body.classList.contains(
    "dark"
    )
    ? "dark"
    : "light"
    );

    updateThemeButton();

}
);

/* ------------------------------
TABLET SUPPORT
------------------------------ */

const isTablet =

/iPad/i.test(
navigator.userAgent
)

||

(
navigator.maxTouchPoints > 1 &&
window.innerWidth >= 768
);

if(isTablet){

    deviceFrame.classList.add(
    "web-view"
    );

    const selector =
    document.querySelector(
    ".device-selector"
    );

    if(selector){

        selector.style.display =
        "none";

    }

}

/* ------------------------------
FULLSCREEN
------------------------------ */

const fullscreenBtn =
document.getElementById(
"fullscreenBtn"
);

fullscreenBtn
.addEventListener(
"click",
async () => {

    try{

        if(
            !document
            .fullscreenElement
        ){

            await document
            .documentElement
            .requestFullscreen();

            fullscreenBtn.textContent =
            "✕ Exit";

        }else{

            await document
            .exitFullscreen();

            fullscreenBtn.textContent =
            "⛶ Fullscreen";

        }

    }
    catch(err){

        console.log(err);

    }

}
);

</script>

</body>

</html>
