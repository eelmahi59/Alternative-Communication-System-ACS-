<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mind2Voice">

<title>Mind2Voice</title>

<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>

<body class="home" data-page="home">

<div class="device-selector">
    <button type="button" class="device-btn active" data-device="ipad" aria-pressed="true">
        Phone/iPad
    </button>

    <button type="button" class="device-btn" data-device="web" aria-pressed="false">
        Web
    </button>

    <button type="button" class="device-btn" id="themeToggle" data-theme-toggle="text">
        🌙 Dark
    </button>

    <button type="button" class="device-btn" id="fullscreenBtn">
        ⛶ Fullscreen
    </button>
</div>

<div class="ipad">

    <div class="camera"></div>

    <div class="screen">
        <div class="content">

            <h1>Mind2Voice</h1>

            <h2>
                AI Assisted Communication for Nonverbal Autism
            </h2>

            <div class="button-row">
                <a href="letterboard.html" class="button">
                    Letter Board
                </a>

                <a href="phraseboard.html" class="button">
                    Phrase Board
                </a>

                <a href="settings.html" class="button secondary">
                    Settings
                </a>

        </div>
    </div>

    <div class="home-indicator"></div>

</div>
