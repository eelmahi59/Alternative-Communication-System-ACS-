<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mind2Voice">

<title>Letter Board | Mind2Voice</title>

<style>

:root{
    --bg:#f5f5f7;
    --panel:#ffffff;
    --text:#1d1d1f;
    --muted:#6e6e73;
    --primary:#0071e3;
    --shadow:rgba(0,0,0,.12);
    --border:rgba(0,0,0,.08);
}

body.dark{
    --bg:#000000;
    --panel:#1c1c1e;
    --text:#f5f5f7;
    --muted:#a1a1a6;
    --primary:#0a84ff;
    --shadow:rgba(0,0,0,.4);
    --border:rgba(255,255,255,.1);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:var(--bg);
    color:var(--text);

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

    min-height:100vh;

    transition:.25s;
}

.app{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.home-link{
    text-decoration:none;
    color:var(--primary);
    font-weight:700;
    font-size:1.1rem;
}

.theme-btn{
    border:none;
    border-radius:999px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:700;

    color:var(--text);
    background:var(--panel);

    box-shadow:0 4px 15px var(--shadow);
}

h1{
    font-size:clamp(2rem,5vw,3.8rem);
    letter-spacing:-0.05em;
}

.subtitle{
    margin-top:8px;
    color:var(--muted);
    margin-bottom:20px;
}

.message{
    min-height:130px;

    background:var(--panel);

    border-radius:28px;

    padding:25px;

    font-size:
    clamp(1.7rem,4vw,2.5rem);

    box-shadow:
    0 10px 30px var(--shadow);

    margin-bottom:15px;

    overflow-wrap:anywhere;
}

.message:empty::before{
    content:"Build your message here...";
    color:var(--muted);
}

/* Prediction Bar */

.predictions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;

    margin-bottom:18px;
}

.suggestion{

    border:none;

    border-radius:999px;

    padding:14px 18px;

    background:#e8f1ff;

    color:#0071e3;

    font-weight:700;

    cursor:pointer;

    font-size:1rem;
}

body.dark .suggestion{
    background:#11345a;
    color:#6eb8ff;
}

/* Controls */

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:20px;
}

.action{

    border:none;

    border-radius:20px;

    padding:16px 22px;

    cursor:pointer;

    font-weight:700;

    font-size:1rem;
}

.primary{
    background:var(--primary);
    color:white;
}

.secondary{
    background:var(--panel);
    color:var(--text);
}

/* Keyboard */

.keyboard{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.keyboard-row{
    display:flex;
    justify-content:center;
    gap:10px;
}

.key{

    min-width:70px;

    min-height:92px;

    border:none;

    border-radius:24px;

    background:var(--panel);

    color:var(--text);

    font-size:2rem;

    font-weight:800;

    cursor:pointer;

    box-shadow:
    0 5px 18px var(--shadow);

    transition:.15s;
}

.key:hover{
    transform:translateY(-2px);
}

.key:active{
    transform:scale(.96);
}

.space-btn{
    margin-top:15px;
    width:100%;
}

.status{
    margin-top:12px;
    color:var(--muted);
}

@media(max-width:768px){

    .key{
        min-width:0;
        flex:1;
        min-height:82px;
        font-size:1.7rem;
    }

    .keyboard-row{
        gap:6px;
    }

}

</style>
</head>
<body>

<div class="app">

    <div class="topbar">

        <a href="index.html"
        class="home-link">
            ← Mind2Voice
        </a>

        <button
        id="themeToggle"
        class="theme-btn">
            🌙 Dark
        </button>

    </div>

    <h1>Letter Board</h1>

    <p class="subtitle">
        Tap letters to communicate.
    </p>

    <div
    id="message"
    class="message"></div>

    <div
    id="predictions"
    class="predictions"></div>

    <div class="controls">

        <button
        id="speak"
        class="action primary">
            🔊 Speak
        </button>

        <button
        id="backspace"
        class="action secondary">
            ⌫ Delete
        </button>

        <button
        id="clear"
        class="action secondary">
            Clear
        </button>

    </div>

    <div
    id="keyboard"
    class="keyboard">
    </div>

    <button
    id="space"
    class="action secondary space-btn">
        Space
    </button>

    <p
    id="status"
    class="status">
    </p>

</div>

<script>

const message =
document.getElementById('message');

const status =
document.getElementById('status');

const keyboard =
document.getElementById('keyboard');

/* -------------------------
QWERTY Layout
------------------------- */

const keyboardRows = [

'QWERTYUIOP',
'ASDFGHJKL',
'ZXCVBNM'

];

function speakLetter(letter){

    if(
        !('speechSynthesis' in window)
    ) return;

    speechSynthesis.cancel();

    const utterance =
    new SpeechSynthesisUtterance(letter);

    utterance.rate = 1.2;

    speechSynthesis.speak(
        utterance
    );

}

function updatePredictions(){

    const predictionBar =
    document.getElementById(
    'predictions'
    );

    predictionBar.innerHTML = '';

    const text =
    message.textContent
    .trim()
    .toUpperCase();

    const map = {

        'I':[
            'NEED',
            'WANT',
            'AM'
        ],

        'I NEED':[
            'HELP',
            'WATER',
            'FOOD',
            'BATHROOM'
        ],

        'I WANT':[
            'WATER',
            'HOME',
            'FOOD',
            'TOY'
        ]

    };

    const suggestions =
    map[text] || [];

    suggestions.forEach(word=>{

        const btn =
        document.createElement('button');

        btn.className =
        'suggestion';

        btn.textContent =
        word;

        btn.onclick = ()=>{

            if(message.textContent){
                message.textContent +=
                ' ';
            }

            message.textContent +=
            word;

            updatePredictions();
        };

        predictionBar.appendChild(btn);

    });

}

function addLetter(letter){

    message.textContent += letter;

    speakLetter(letter);

    updatePredictions();

}

keyboardRows.forEach(row=>{

    const rowDiv =
    document.createElement('div');

    rowDiv.className =
    'keyboard-row';

    row.split('').forEach(letter=>{

        const btn =
        document.createElement('button');

        btn.className =
        'key';

        btn.textContent =
        letter;

        btn.onclick =
        ()=>addLetter(letter);

        rowDiv.appendChild(btn);

    });

    keyboard.appendChild(rowDiv);

});

/* Controls */

document.getElementById(
'space'
).onclick = ()=>{

    if(
        message.textContent &&
        !message.textContent.endsWith(' ')
    ){
        message.textContent += ' ';
    }

    updatePredictions();

};

document.getElementById(
'backspace'
).onclick = ()=>{

    message.textContent =
    message.textContent.slice(
    0,
    -1
    );

    updatePredictions();

};

document.getElementById(
'clear'
).onclick = ()=>{

    message.textContent = '';

    status.textContent =
    'Message cleared';

    updatePredictions();

};

document.getElementById(
'speak'
).onclick = ()=>{

    const text =
    message.textContent.trim();

    if(!text){
        status.textContent =
        'Create a message first.';
        return;
    }

    speechSynthesis.cancel();

    const speech =
    new SpeechSynthesisUtterance(
    text);

    speech.rate = .9;

    speech.onstart = ()=>{
        status.textContent =
        'Speaking...';
    };

    speech.onend = ()=>{
        status.textContent =
        '';
    };

    speechSynthesis.speak(
    speech
    );

};

/* Theme */

const themeToggle =
document.getElementById(
'themeToggle'
);

function updateTheme(){

    themeToggle.textContent =
    document.body.classList.contains(
    'dark'
    )
    ? '☀️ Light'
    : '🌙 Dark';

}

themeToggle.onclick = ()=>{

    document.body.classList.toggle(
    'dark'
    );

    localStorage.setItem(
    'theme',
    document.body.classList.contains(
    'dark'
    )
    ? 'dark'
    : 'light'
    );

    updateTheme();

};

const savedTheme =
localStorage.getItem(
'theme'
);

if(savedTheme){
    document.body.classList.toggle(
    'dark',
    savedTheme==='dark'
    );
}

updateTheme();

updatePredictions();

</script>

</body>
</html>
