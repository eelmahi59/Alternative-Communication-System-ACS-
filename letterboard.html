<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mind2Voice">

<title>Letter Board | Mind2Voice</title>

<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>

<body class="letters" data-page="letters">

<main class="app">

    <header class="topbar">
        <a href="index.html">← Mind2Voice</a>
        <button class="action secondary" id="themeToggle" type="button" data-theme-toggle="text">🌙 Dark</button>
    </header>

    <section>
        <h1>Letter Board</h1>
        <p class="hint">Tap letters to build a message, then choose an action.</p>
    </section>

    <div id="message" class="message"></div>

    <div class="controls">
        <button class="action" id="speak" type="button">🔊 Speak</button>
        <button class="action secondary" id="backspace" type="button">⌫ Delete</button>
        <button class="action secondary" id="clear" type="button">Clear</button>
    </div>

    <div class="keyboard" id="keyboard"></div>

    <button class="action secondary space-action" id="space" type="button">
        Space
    </button>

    <p class="status" id="status" role="status" aria-live="polite"></p>

</main>

<script src="app.js"></script>

</body>
</html>
