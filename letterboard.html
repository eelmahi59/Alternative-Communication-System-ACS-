<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mind2Voice">

<title>Letter Board | Mind2Voice</title>

<style>
:root{
    color-scheme:light;
    --bg:#f5f5f7;
    --text:#1d1d1f;
    --muted:#6e6e73;
    --primary:#0071e3;
    --panel:#fff;
    --key:#fff;
    --border:rgba(0,0,0,.1);
    --shadow:rgba(0,0,0,.15);
}

body.dark{
    color-scheme:dark;
    --bg:#000;
    --text:#f5f5f7;
    --muted:#a1a1a6;
    --primary:#0a84ff;
    --panel:#1c1c1e;
    --key:#2c2c2e;
    --border:rgba(255,255,255,.12);
    --shadow:rgba(0,0,0,.45);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    transition:background .2s,color .2s;
}

.app{
    width:min(100%,1000px);
    height:100vh;
    margin:auto;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow:hidden;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.topbar a,
.topbar button{
    font:inherit;
}

.topbar a{
    color:var(--primary);
    text-decoration:none;
    font-weight:700;
}

.topbar button,
.action{
    border:0;
    border-radius:999px;
    padding:8px 14px;
    background:var(--panel);
    color:var(--text);
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 12px var(--shadow);
}

h1{
    font-size:clamp(1.2rem,2.5vw,1.8rem);
    line-height:1;
    margin:0;
}

.hint{
    margin:2px 0 0;
    color:var(--muted);
    font-size:.85rem;
    line-height:1.1;
}

.message{
    min-height:50px;
    padding:8px 12px;
    background:var(--panel);
    border:2px solid var(--border);
    border-radius:16px;
    font-size:clamp(1.2rem,2.6vw,2rem);
    line-height:1.15;
    overflow-wrap:anywhere;
    box-shadow:0 8px 24px var(--shadow);
}

.message:empty:before{
    content:"Your message will appear here…";
    color:var(--muted);
    font-size:1rem;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.action{
    min-height:48px;
}

.action.secondary{
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--border);
}

.action:not(.secondary){
    background:var(--primary);
    color:#fff;
}

.keyboard{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:6px;
}

.key{
    width:100%;
    height:100%;
    min-height:0;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--key);
    color:var(--text);
    font-size:clamp(1.2rem,2.5vw,2.5rem);
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 10px var(--shadow);
    touch-action:manipulation;
}

.key:active,
.action:active{
    transform:scale(.97);
}

button:focus-visible,
a:focus-visible{
    outline:3px solid var(--primary);
    outline-offset:3px;
}

.space-action{
    width:100%;
    min-height:48px;
}

.status{
    min-height:1.2em;
    color:var(--muted);
    font-size:.85rem;
}

@media (max-width:520px){
    .app{
        padding:6px;
        gap:4px;
    }

    .keyboard{
        gap:4px;
    }

    .key{
        font-size:1.1rem;
    }

    .message{
        min-height:44px;
        font-size:1.1rem;
    }
}
</style>
</head>

<body>

<main class="app">

    <header class="topbar">
        <a href="index.html">← Mind2Voice</a>
        <button id="themeToggle" type="button">🌙 Dark</button>
    </header>

    <section>
        <h1>Letter Board</h1>
        <p class="hint">Tap letters to build a message, then choose an action.</p>
    </section>

    <div id="message" class="message"></div>

    <div class="controls">
        <button class="action" id="speak">🔊 Speak</button>
        <button class="action secondary" id="backspace">⌫ Delete</button>
        <button class="action secondary" id="clear">Clear</button>
    </div>

    <div class="keyboard" id="keyboard"></div>

    <button class="action secondary space-action" id="space">
        Space
    </button>

    <p class="status" id="status"></p>

</main>

<script>
const message=document.getElementById('message');
const status=document.getElementById('status');
const keyboard=document.getElementById('keyboard');

'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(letter=>{
    const button=document.createElement('button');
    button.type='button';
    button.className='key';
    button.textContent=letter;

    button.addEventListener('click',()=>{
        message.textContent+=letter;
        status.textContent='';
    });

    keyboard.appendChild(button);
});

document.getElementById('space').addEventListener('click',()=>{
    if(message.textContent &&
       !message.textContent.endsWith(' ')){
        message.textContent+=' ';
    }
});

document.getElementById('backspace').addEventListener('click',()=>{
    message.textContent=message.textContent.slice(0,-1);
});

document.getElementById('clear').addEventListener('click',()=>{
    message.textContent='';
    status.textContent='Message cleared.';
});

document.getElementById('speak').addEventListener('click',()=>{
    const text=message.textContent.trim();

    if(!text){
        status.textContent='Add a message before speaking.';
        return;
    }

    if(!('speechSynthesis' in window)){
        status.textContent='Speech is not available.';
        return;
    }

    speechSynthesis.cancel();

    const utterance=new SpeechSynthesisUtterance(text);

    utterance.onstart=()=>{
        status.textContent='Speaking...';
    };

    utterance.onend=()=>{
        status.textContent='';
    };

    utterance.onerror=()=>{
        status.textContent='Speech could not be played.';
    };

    speechSynthesis.speak(utterance);
});

const themeToggle=document.getElementById('themeToggle');

function updateTheme(){
    const dark=document.body.classList.contains('dark');

    themeToggle.textContent=
        dark ? '☀️ Light' : '🌙 Dark';
}

themeToggle.addEventListener('click',()=>{
    document.body.classList.toggle('dark');

    localStorage.setItem(
        'theme',
        document.body.classList.contains('dark')
        ? 'dark'
        : 'light'
    );

    updateTheme();
});

const savedTheme=localStorage.getItem('theme');

if(savedTheme){
    document.body.classList.toggle(
        'dark',
        savedTheme==='dark'
    );
}else{
    document.body.classList.toggle(
        'dark',
        window.matchMedia('(prefers-color-scheme: dark)').matches
    );
}

updateTheme();
</script>

</body>
</html>
